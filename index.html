<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小 Clawd 的 Java 大陆</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 11 8'%3E%3Cpath fill='%23d97757' d='M2 0h7v2h2v2H9v2H2V4H0V2h2z'/%3E%3Cpath fill='%23141826' d='M3 2h1v2H3zM7 2h1v2H7z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap">
<style>
/* 布局：顶部状态栏（血量、形态）→ 立体大陆地图（画布，弯曲小路）→ 模糊转场 → 战斗画面；单一深色街机风，刻意不做浅色主题 */
:root{
  --night:#141826; --panel:#1f2538; --line:#39415e; --ink:#eef0f7; --dim:#9aa3c2;
  --clawd:#d97757; --hp:#e5484d; --heal:#46c37b; --gold:#f2c14e;
  --pix:"DotGothic16","Microsoft YaHei",monospace; --num:"Press Start 2P","DotGothic16",monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--pix);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{margin:0 auto;display:flex;flex-direction:column;gap:12px}
/* 游戏 HUD：贴在地图顶部，滚动时一直可见 */
.hud{position:absolute;top:8px;left:8px;z-index:5;width:min(300px,calc(100% - 16px))}
.hudcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 8px;align-items:center;
  padding:6px 8px;background:rgba(20,24,38,.82);border:3px solid var(--ink);box-shadow:0 0 0 2px #000,3px 3px 0 2px rgba(0,0,0,.4)}
#face{width:36px;height:36px;background:#2b3557;border:2px solid var(--line)}
.hudmain{min-width:0;display:flex;flex-direction:column;gap:2px}
.hudtop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-family:var(--pix);font-size:14px;margin:0;line-height:1.2}
h1 b{color:var(--clawd)} h1 span{color:var(--gold)}
.lvl{font-family:var(--num);font-size:10px;color:var(--gold)}
.hprow{display:flex;align-items:center;gap:6px}
.heart{width:14px;height:12px;flex:none;background:var(--hp);clip-path:polygon(0 25%,25% 0,50% 25%,75% 0,100% 25%,100% 50%,50% 100%,0 50%)}
.hpbar{flex:1;height:12px;border:2px solid var(--ink);background:#2a1418;position:relative}
.hpbar i{position:absolute;inset:0 auto 0 0;background:var(--hp);transition:width .6s steps(12)}
.hpbar i.ok{background:var(--heal)}
.hpbar::after{content:"";position:absolute;inset:0 0 50% 0;background:rgba(255,255,255,.18)}
.v{font-family:var(--num);font-size:9px;color:var(--ink);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:0 8px;font-size:11px;color:var(--dim);grid-column:1/-1}
.chip b{font-family:var(--num);font-size:9px;color:var(--ink)}
.chip.g{color:var(--heal)} .chip.y{color:var(--gold)}
button.chip{font:inherit;font-size:11px;background:none;border:0;box-shadow:none;padding:0;color:var(--gold);cursor:pointer;text-decoration:underline dotted}
button.icon{font-size:16px;line-height:1;padding:2px 7px;align-self:start;box-shadow:2px 2px 0 #000}
.toast{grid-column:1/-1;font-size:11px;color:var(--dim);border-top:2px dashed var(--line);padding-top:2px}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
/* 连接设置弹窗 */
.setup{position:absolute;inset:0;margin:auto;z-index:20;width:min(460px,calc(100% - 32px));height:fit-content;display:flex;flex-direction:column;gap:10px;
  padding:16px;background:rgba(20,24,38,.95);border:3px solid var(--ink);box-shadow:0 0 0 3px #000,6px 6px 0 3px rgba(0,0,0,.5)}
.setup h2{margin:0;font-size:18px;color:var(--gold)} .setup p{margin:0;font-size:13px;color:var(--dim)}
.setup input{font:inherit;font-size:13px;padding:8px;background:#0e1322;color:var(--ink);border:2px solid var(--line);width:100%}
.setup input:focus{outline:2px solid var(--gold)}
/* 每日机制：宝箱弹窗、背包 */
.chip.o{color:#ff9a5c} .chip.r{color:#ff9aa0}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(8,10,20,.72);padding:16px}
.mbox{width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;background:#1f2538;border:3px solid var(--ink);box-shadow:0 0 0 3px #000,6px 6px 0 3px rgba(0,0,0,.5);text-align:center}
.mbox.wide{width:min(620px,100%);max-height:86vh;overflow:auto;align-items:stretch;text-align:left}
.mbox h2{margin:0;font-size:20px} .mday{margin:0;font-size:12px;color:var(--dim)} .mmeta{margin:0;font-size:12px;color:var(--dim)}
.mbox canvas{width:240px;height:170px;max-width:100%}
.mbtns{display:flex;gap:8px;margin-top:6px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;background:#141a2e;color:var(--ink);border:2px solid var(--line);box-shadow:none;font-size:11px;cursor:pointer}
.slot canvas{width:48px;height:40px}
.slot.lock{cursor:default;color:var(--dim);opacity:.6}
.slot.on{background:#2b3557;outline:2px solid var(--gold)}
/* 圆润画风：圆角、毛玻璃、无衬线字体 */
body.smooth{--pix:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--num:"Noto Sans SC","PingFang SC",sans-serif}
body.smooth canvas{image-rendering:auto}
body.smooth .stage{border:0;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
body.smooth .hudcard,body.smooth .legend,body.smooth .side,body.smooth .mbox,body.smooth .setup{border:1px solid rgba(255,255,255,.18);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.35);background:rgba(24,30,52,.74);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
body.smooth h1,body.smooth .side h2,body.smooth .mbox h2,body.smooth .setup h2{font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif;letter-spacing:.02em}
body.smooth button{border:0;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.3);background:linear-gradient(#ffa06e,#e06a3c);color:#fff;font-weight:600}
body.smooth button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
body.smooth button.ghost{background:rgba(255,255,255,.14);color:var(--ink);box-shadow:none}
body.smooth button.chip{background:none;box-shadow:none;border-radius:0;font-weight:500;color:var(--gold)}
body.smooth .hpbar{border:0;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden;height:10px}
body.smooth .hpbar i{border-radius:999px;transition:width .6s ease;background:linear-gradient(90deg,#ff6b6b,#ff9f6b)}
body.smooth .hpbar i.ok{background:linear-gradient(90deg,#3ccf7a,#9be15d)}
body.smooth .hpbar::after{display:none}
body.smooth .heart{clip-path:none;background:none;width:auto;height:auto;line-height:1}
body.smooth .heart::before{content:"❤";color:#ff6b6b;font-size:13px}
body.smooth #face{border-radius:12px;border:0;background:rgba(255,255,255,.12)}
body.smooth .slot{border-radius:12px;background:rgba(255,255,255,.06);color:var(--ink);box-shadow:none;font-weight:500}
body.smooth .slot.on{background:rgba(255,214,102,.18)}
body.smooth .tag{border-radius:999px}
body.smooth .toast{border-top:1px solid rgba(255,255,255,.12)}
body.smooth .lg-flags i{border-radius:50%;border:0;width:9px;height:9px}
body.smooth .setup input{border-radius:10px;border:1px solid rgba(255,255,255,.2)}
/* 升级特效层 */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:50;cursor:pointer}
.toast.err{color:#ff9aa0}
button{font-family:var(--pix);font-size:14px;background:var(--clawd);color:#1b0f0a;border:3px solid var(--ink);padding:6px 12px;cursor:pointer;box-shadow:3px 3px 0 #000}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
button.ghost{background:transparent;color:var(--ink)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stage{position:relative;border:3px solid var(--line);background:#0b2238;overflow:hidden;height:94vh;height:94dvh}
.scroller{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto}
/* 右下角图例，和 HUD 同一套像素面板样式 */
.legend{position:absolute;right:8px;bottom:8px;z-index:5;max-width:min(320px,calc(100% - 16px));display:flex;flex-direction:column;align-items:flex-end;gap:4px;
  padding:6px 8px;background:rgba(20,24,38,.82);border:3px solid var(--ink);box-shadow:0 0 0 2px #000;font-size:11px;color:var(--dim)}
.lg-flags{display:flex;flex-wrap:wrap;gap:2px 10px;justify-content:flex-end}
.lg-flags i{display:inline-block;width:10px;height:8px;margin-right:4px;border:1px solid #000;vertical-align:middle}
.legend .log{max-height:40vh;overflow:auto;align-self:stretch;border-top:2px dashed var(--line);padding-top:4px;font-size:12px}
.battle:not([hidden]) ~ .legend, .stage.fighting .legend{display:none}
[hidden]{display:none!important}
canvas{display:block;image-rendering:pixelated;max-width:100%}
#map{width:100%;margin:0 auto;height:auto;cursor:pointer;transition:filter .9s ease,opacity .9s ease,transform .9s ease}
#map.blur{filter:blur(14px) brightness(.6);transform:scale(1.06);opacity:.4}
.note{font-size:13px;color:var(--dim);margin:0}
.status{padding:10px 14px;border:3px dashed var(--line);font-size:14px}
.status.err{border-color:var(--hp)}
/* 战斗：画面铺满游戏区，关卡信息是底部的 RPG 对话框 */
.battle{position:relative;height:100%;background:#1b2442;transition:filter .7s ease,opacity .7s ease}
.battle.enter{filter:blur(14px);opacity:0}
.battle canvas{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:center 30%}
@media (max-aspect-ratio:1/1){.battle canvas{object-fit:contain;object-position:center 40%}}
.side{position:absolute;left:max(12px,2%);right:max(12px,2%);bottom:12px;max-height:34%;overflow:auto;
  padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;
  background:rgba(20,24,38,.88);border:3px solid var(--ink);box-shadow:0 0 0 3px #000}
.side .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.side h2{margin:0;font-size:17px;text-wrap:balance}
.side .btns{margin-left:auto;display:flex;gap:8px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border:2px solid currentColor}
.tag.cleared{color:var(--heal)} .tag.shaky{color:var(--gold)} .tag.todo{color:var(--dim)}
.ev{font-size:13px;color:var(--dim);max-height:9.5em;overflow:auto;margin:0}
.log{font-size:13px;margin:0;padding-left:1.2em;color:var(--dim)}
.log li b{color:var(--ink)}
.dmg{color:var(--hp)} .hl{color:var(--heal)}
details summary{cursor:pointer;color:var(--ink)}
@media (max-width:640px){.battle{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.hpbar i,#map,.battle{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="stage" id="stage">
    <section class="hud" aria-label="小 Clawd 状态"><div class="hudcard">
      <canvas id="face" width="48" height="48" aria-hidden="true"></canvas>
      <div class="hudmain">
        <div class="hudtop">
          <h1>小 <b>Clawd</b> · <span id="formName">见习</span></h1>
          <span class="lvl">Lv.<span id="lvl">0</span></span>
        </div>
        <div class="hprow">
          <span class="heart" aria-hidden="true"></span>
          <div class="hpbar"><i id="hpi" style="width:0%"></i></div>
          <span class="v" id="hpv">--/100</span>
        </div>
      </div>
      <div style="display:flex;gap:4px;align-self:start">
        <button class="ghost icon" id="refresh" type="button" title="刷新学习卡" aria-label="刷新学习卡">↻</button>
        <button class="ghost icon" id="styleBtn" type="button" title="切换画风" aria-label="切换画风">🎨</button>
        <button class="ghost icon" id="settings" type="button" title="连接设置" aria-label="连接设置">⚙</button>
      </div>
      <div class="chips">
        <span class="chip g">✔ <b id="sCleared">-</b> 已通</span>
        <span class="chip y">? <b id="sShaky">-</b> 待复测</span>
        <button class="chip" id="formNext" type="button" title="回放升级特效"></button>
      </div>
      <div class="chips daily">
        <span class="chip o" id="streak">🔥 —</span>
        <span class="chip" id="mood"></span>
        <button class="chip" id="chestBtn" type="button" hidden>🎁 <b id="chestN">0</b> 个宝箱</button>
        <button class="chip" id="bagBtn" type="button">🎒 背包</button>
      </div>
      <div class="toast" id="status">正在连接 Google Drive，读取学习状态卡…</div>
    </div></section>
    <aside class="legend" aria-label="图例">
      <div class="lg-flags">
        <span><i style="background:#46c37b"></i>已通关</span>
        <span><i style="background:#f2c14e"></i>待复测</span>
        <span><i style="background:#7fb0e0"></i>没记录</span>
        <span><i style="background:#8a92b0"></i>未开打</span>
      </div>
      <button class="chip" id="rulesBtn" type="button" aria-expanded="false">? 血量规则</button>
      <ul class="log" id="hpLog" hidden></ul>
    </aside>
    <div class="scroller" id="scroller">
    <canvas id="map" width="480" height="900" aria-label="关卡地图，第 1 关在最下面"></canvas>
    <section class="battle" id="battle" hidden>
      <canvas id="arena" width="320" height="180" aria-label="战斗画面"></canvas>
      <div class="side">
        <div class="row">
          <span class="tag" id="bTag"></span>
          <h2 id="bName"></h2>
          <div class="btns">
            <button id="fight" type="button">出击！</button>
            <button class="ghost" id="back" type="button">回地图</button>
          </div>
        </div>
        <div id="bInfo" class="note"></div>
        <details><summary>老师写下的证据</summary><p class="ev" id="bEv"></p></details>
      </div>
    </section>
    </div>
  </div>
  <div class="modal" id="loot" hidden>
    <div class="mbox">
      <p class="mday" id="lootDay"></p>
      <canvas id="lootCv" width="240" height="170" aria-hidden="true"></canvas>
      <h2 id="lootName"></h2>
      <p class="mmeta" id="lootMeta"></p>
      <div class="mbtns"><button id="lootEquip" type="button" hidden>马上装备</button><button class="ghost" id="lootClose" type="button">收下</button></div>
    </div>
  </div>
  <div class="modal" id="bag" hidden>
    <div class="mbox wide">
      <div class="mhead"><h2>🎒 背包 <span id="bagCount"></span></h2><button class="ghost" id="bagClose" type="button">关闭</button></div>
      <p class="mmeta">每天学习一次就能开一个宝箱。点帽子、颜色、宠物可以装备，再点一次卸下；营地装饰会自动摆在营火旁边。</p>
      <div class="bag" id="bagGrid"></div>
    </div>
  </div>
  <canvas id="fx" hidden aria-label="升级特效，点击关闭"></canvas>
</div>

<script>

// 全部关卡，按 05 课程地图的顺序。m = 在学习卡「知识点｜名称」里找哪一行；
// zone = 所在区域；past = 这个模块已经学过（卡里没记录也不算“未开打”）
const CURRICULUM = [
  // 新手草原：SE-01 至 SE-04 基础语法
  {n:"JDK 与第一个程序", mod:"SE-01", zone:0, m:/基础语法/, past:1},
  {n:"变量与数据类型", mod:"SE-01", zone:0, m:/基础语法/, past:1},
  {n:"类型转换", mod:"SE-02", zone:0, m:/基础语法/, past:1},
  {n:"运算符", mod:"SE-02", zone:0, m:/基础语法/, past:1},
  {n:"输入输出 Scanner", mod:"SE-02", zone:0, m:/基础语法/, past:1},
  {n:"if 分支", mod:"SE-03", zone:0, m:/^if 判断/, past:1},
  {n:"switch", mod:"SE-03", zone:0, m:/基础语法/, past:1},
  {n:"for 循环", mod:"SE-03", zone:0, m:/基础语法/, past:1},
  {n:"while / do-while", mod:"SE-03", zone:0, m:/基础语法/, past:1},
  {n:"break 与 continue", mod:"SE-03", zone:0, m:/基础语法/, past:1},
  {n:"嵌套循环", mod:"SE-03", zone:0, m:/^嵌套循环/, past:1},
  {n:"一维数组", mod:"SE-04", zone:0, m:/^数组创建和遍历/, past:1},
  {n:"二维数组", mod:"SE-04", zone:0, m:/^二维数组/, past:1},
  {n:"方法参数与返回值", mod:"SE-02", zone:0, m:/^方法的参数和返回值/, past:1},
  {n:"方法重载", mod:"SE-02", zone:0, m:/基础语法/, past:1},
  // 秋枫山谷：SE-05 至 SE-07 面向对象
  {n:"类与对象", mod:"SE-05", zone:1, m:/^类与对象/, past:1},
  {n:"构造器与 this", mod:"SE-05", zone:1, m:/^类与对象/, past:1},
  {n:"封装", mod:"SE-05", zone:1, m:/^封装/, past:1},
  {n:"static", mod:"SE-05", zone:1, m:/^static/, past:1},
  {n:"继承", mod:"SE-06", zone:1, m:/^继承/, past:1},
  {n:"重写与 super", mod:"SE-06", zone:1, m:/^继承/, past:1},
  {n:"多态", mod:"SE-06", zone:1, m:/^多态/, past:1},
  {n:"final 与单例", mod:"SE-07", zone:1, m:/^final/, past:1},
  {n:"枚举", mod:"SE-07", zone:1, m:/^枚举/, past:1},
  {n:"抽象类", mod:"SE-07", zone:1, m:/^抽象类/, past:1},
  {n:"接口", mod:"SE-07", zone:1, m:/^接口/, past:1},
  {n:"try-catch-finally", mod:"SE-07", zone:1, m:/^try-catch/, past:1},
  {n:"智能家居综合项目", mod:"SE-07", zone:1, m:null, past:1, special:"project"},
  // 雪原高地：SE-08 高级语法、String、ArrayList，加上本周的实战任务
  {n:"代码块", mod:"SE-08", zone:2, m:/^代码块/, past:1},
  {n:"成员与静态内部类", mod:"SE-08", zone:2, m:/^内部类/, past:1},
  {n:"匿名内部类", mod:"SE-08", zone:2, m:/^匿名内部类/, past:1},
  {n:"Lambda", mod:"SE-08", zone:2, m:/^Lambda/, past:1},
  {n:"方法引用", mod:"SE-08", zone:2, m:/^方法引用/, past:1},
  {n:"String 基础", mod:"SE-08", zone:2, m:/^String 基础/, past:1},
  {n:"String 输入校验", mod:"SE-08", zone:2, m:/^String 输入校验/},
  {n:"ArrayList 增删查", mod:"SE-08", zone:2, m:/^ArrayList 基础/, past:1},
  {n:"ArrayList 存取对象", mod:"SE-08", zone:2, m:/^ArrayList 存对象/, past:1},
  {n:"ArrayList 复习小测", mod:"SE-08", zone:2, m:null, special:"arraylist"},
  {n:"算法：数组＋循环 第 1 题", mod:"算法", zone:2, m:null, special:"algo1"},
  {n:"算法：数组＋循环 第 2 题", mod:"算法", zone:2, m:null, special:"algo2"},
  {n:"Git 独立提交", mod:"Git", zone:2, m:null, special:"git"},
  // 熔岩王城：SE-11 至 SE-16 Java 进阶
  {n:"异常体系", mod:"SE-11", zone:3, m:/^异常/},
  {n:"泛型", mod:"SE-11", zone:3, m:/^泛型/},
  {n:"包装类", mod:"SE-11", zone:3, m:/^包装类/},
  {n:"Collection 与 List", mod:"SE-11", zone:3, m:/^(Collection|List)/},
  {n:"LinkedList 原理", mod:"SE-11", zone:3, m:/^LinkedList/},
  {n:"Set 去重", mod:"SE-12", zone:3, m:/^Set/},
  {n:"Map 键值对", mod:"SE-12", zone:3, m:/^(Map|HashMap)/},
  {n:"Stream 流", mod:"SE-12", zone:3, m:/^Stream/},
  {n:"File 与递归", mod:"SE-13", zone:3, m:/^File/},

// ---------- 读学习卡 ----------
function parseCard(text){
  const lines = text.split("\n").map(s=>s.trim()).filter(Boolean);
  // 1) 读出学习卡里的每一行知识点
  const card = [];
  for(const l of lines){
    if(!l.startsWith("知识点｜")) continue;
    const p = l.split("｜");
    const lv = p[2]||"";
    const ev = p.slice(3).join("｜").replace(/^证据：/,"");
    card.push({ key:p[1], lv:lv.replace(/^状态：/,""), ev, used:false,
      status: /Level\s*[345]/.test(lv) ? "cleared" : "shaky" });
  }
  const pack = (c, name, mod, zone, extra={}) => ({
    name, full:`${name}（${mod}）`, mod, zone, lv:c?c.lv:"未开打", ev:c?c.ev:"", status:c?c.status:"todo",
    hints:c?(c.ev.match(/经(一次|两次)?提示|经指出|经纠正/g)||[]).length:0,
    wins:c?(c.ev.match(/独立|全对|一次写对|与预期一致/g)||[]).length:0, ...extra });
  // 2) 按课程地图排关卡，每关去学习卡里找对应的行
  const solved = +((text.match(/算法（力扣 Hot 100）：已完成\s*(\d+)/)||[])[1]||0);
  const ordered = CURRICULUM.map(s=>{
    if(s.special){
      const done = {
        project: /SE-07 综合项目核心练习已验收/.test(text) ? "shaky" : null,
        arraylist: /ArrayList[^。\n；]{0,8}(小测通过|复习完成|已完成)/.test(text) ? "cleared" : null,
        algo1: solved>=1 ? "cleared" : null,
        algo2: solved>=2 ? "cleared" : null,
        git: /Git[^。\n]{0,12}独立提交[^。\n]{0,12}(通过|已完成)/.test(text) ? "cleared" : null
      }[s.special];
      const lv = s.special==="project" ? "核心练习已验收，整体项目暂不认定为 Level 3" : done ? "已完成" : "未开打";
      return pack(done?{lv, ev:"", status:done}:null, s.n, s.mod, s.zone, done?{}:{lv});
    }
    const c = card.find(x=>s.m.test(x.key));
    if(c){ c.used = true; return pack(c, s.n, s.mod, s.zone) }
    return pack(null, s.n, s.mod, s.zone, s.past ? {status:"unrec", lv:"学习卡里没有记录"} : {});
  });
  // 3) 学习卡里有、课程地图里没列的知识点，插到第一个未开打的关卡前面
  const firstTodo = ordered.findIndex(s=>s.status==="todo");
  const extras = card.filter(c=>!c.used).map(c=>pack(c, c.key.replace(/（.*$/,""), "学习卡", ordered[Math.max(0,firstTodo-1)].zone));
  ordered.splice(firstTodo<0?ordered.length:firstTodo, 0, ...extras);
  const stages = card;
  const douSeg = (text.match(/已知抖点：([^\n]*)/)||[])[1]||"";
  const dou = douSeg.split("；").filter(Boolean).map(t=>{
    const [k,v] = t.includes("：") ? t.split(/：(.*)/s) : ["其他",t];
    return {topic:k.trim(), n: v ? v.split(/，|、/).filter(Boolean).length : 1};
  });
  const reviewSeg = (text.match(/抽点记录：([^｜]*)/)||[])[1]||"";
  const reviews = (reviewSeg.match(/闭卷复习/g)||[]).length;
  const allRight = stages.reduce((a,s)=>a+(s.ev.match(/全对/g)||[]).length,0);
  const wd = ["周日","周一","周二","周三","周四","周五","周六"][new Date().getDay()];
  const today = (text.match(new RegExp("计划·"+wd+"：([^\\n]*)"))||[])[1]||"";
  const updated = (text.match(/最后更新：([0-9-]+)/)||[])[1]||"";
  // 每次上课的日期（「学习｜2026-10-21｜02｜1.5小时｜…」；跨天的写法两头都算）
  const days = new Set();
  for(const l of lines){ if(!l.startsWith("学习｜")) continue; ((l.split("｜")[1]||"").match(/\d{4}-\d{2}-\d{2}/g)||[]).forEach(d=>days.add(d)) }
  return {stages:ordered, dou, reviews, allRight, today, wd, updated, days:[...days]};
}

// 血量规则：从 100 起，每个抖点 -5，每次闭卷复习 +10，每次短测全对 +5
function computeHp(d){
  const douN = d.dou.reduce((a,x)=>a+x.n,0);
  return {hp:Math.max(0, Math.min(100, 100 - douN*5 + d.reviews*10 + d.allRight*5)), douN};
}

// ---------- 噪声 ----------
function hash(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s) }
function noise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi), b=hash(xi+1,yi), c=hash(xi,yi+1), d=hash(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
const fbm = (x,y)=>noise(x,y)*.6+noise(x*2.1,y*2.1)*.3+noise(x*4.3,y*4.3)*.1;

const BODY = [
  "..XXXXXXX..",
  "..XXXXXXX..",
  "XXXEXXXEXXX",
  "XXXEXXXEXXX",
  "..XXXXXXX..",
  "..XXXXXXX..",
  "..X.X.X.X..",
  "..X.X.X.X.."];
function px(ctx,x,y,s,i,j,c){ ctx.fillStyle=c; ctx.fillRect(x+i*s,y+j*s,s,s) }
function drawClawd(ctx,x,y,s,tier,t=0,legPhase=0){
  if(STYLE==="smooth") return drawClawdSmooth(ctx,x,y,s,tier,t,legPhase);
  const bc = bodyCols(t), tired = DAILY.hungry;
  // 影子
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath(); ctx.ellipse(x+5.5*s,y+8.3*s,5*s,1.3*s,0,0,7); ctx.fill();
  if(tier>=4){ // 王者光环
    const g=ctx.createRadialGradient(x+5.5*s,y+3*s,s,x+5.5*s,y+3*s,9*s);
    g.addColorStop(0,`rgba(242,193,78,${.35+.15*Math.sin(t/6)})`); g.addColorStop(1,"rgba(242,193,78,0)");
    ctx.fillStyle=g; ctx.fillRect(x-4*s,y-6*s,19*s,17*s);
  }
  if(tier>=3){ for(let j=1;j<8;j++) for(let i=1;i<10;i++) px(ctx,x-s,y,s,i,j+ (j>5?0:0), j>5?"#2f4ab8":"#3b5bdb") } // 披风
  BODY.forEach((row,j)=>[...row].forEach((c,i)=>{
    if(c===".") return;
    if(j>=6 && legPhase && (i===2||i===6) && j===7) return; // 走路时抬腿
    if(j>=6 && legPhase && (i===4||i===8) && j===7 && legPhase<0) return;
    px(ctx,x,y,s,i,j,c==="E"?(tired&&j===2?bc[0]:"#141826"):(j>=6?bc[1]:bc[0]));
  }));
  // 高光，让它更立体
  for(let i=2;i<9;i++) px(ctx,x,y,s,i,0,bc[2]);
  if(!LOOK.hat && tier>=1 && tier<3){ for(let i=2;i<9;i++) px(ctx,x,y,s,i,1,"#e5484d"); px(ctx,x,y,s,9,1,"#e5484d"); px(ctx,x,y,s,10,2,"#e5484d") } // 头巾
  if(!LOOK.hat && tier===3){ for(let i=2;i<9;i++) px(ctx,x,y,s,i,-1,"#b8c0d8"); for(let i=4;i<7;i++) px(ctx,x,y,s,i,-2,"#dfe4f2"); px(ctx,x,y,s,5,-3,"#e5484d") } // 头盔
  if(!LOOK.hat && tier>=4){ for(let i=2;i<9;i++) px(ctx,x,y,s,i,-1,"#f2c14e"); [2,4,6,8].forEach(i=>px(ctx,x,y,s,i,-2,"#f2c14e")); px(ctx,x,y,s,5,-1,"#e5484d") } // 王冠
  if(tier>=2){ // 剑
    for(let j=-3;j<4;j++) px(ctx,x,y,s,11,j,tier>=4?"#ffe9a8":"#dfe6f5");
    px(ctx,x,y,s,10,4,"#f2c14e"); px(ctx,x,y,s,11,4,"#f2c14e"); px(ctx,x,y,s,12,4,"#f2c14e"); px(ctx,x,y,s,11,5,"#7a4b2a");
  }
  if(LOOK.hat && byId[LOOK.hat]){ const h=byId[LOOK.hat]; drawGrid(ctx,x,y,s,h.px,0,h.j0) }
  if(LOOK.pet && byId[LOOK.pet]){ const p=byId[LOOK.pet]; drawGrid(ctx,x,y,s,p.px,14,3+Math.round(Math.sin(t/7))) }
}

const todayStr = () => new Date().toLocaleDateString("sv-SE");
function addDays(d,n){ const t=new Date(d+"T12:00:00"); t.setDate(t.getDate()+n); return t.toLocaleDateString("sv-SE") }
function strHash(s){ let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619) } return (h>>>0)/4294967296 }
function mix(a,b,t){ const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)); const A=p(a),B=p(b); return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("") }

var LOOK = {hat:null,color:null,pet:null};

try{ opened = new Set(JSON.parse(localStorage.getItem("clawd-opened")||"[]")) }catch(e){}
var DAILY = {ready:false, days:[], streak:0, best:0, fire:0, warn:false, owned:new Map(), loot:{}, unopened:[], since:99, hungry:false, studiedToday:false, step:""};

function computeDaily(){
  const days = [...(data.days||[])].sort();
  const today = todayStr();
  const d = {ready: days.length>0, days, owned:new Map(), loot:{}};
  // 宽容连续：漏 1 天不断（营火变小），连续漏 2 天才清零；今天还没学不算漏
  let cur=0, best=0, miss=0;
  if(days.length){
    const set = new Set(days);
    for(let t=days[0]; t<=today; t=addDays(t,1)){
      if(set.has(t)){ if(miss>=2) cur=0; cur++; miss=0; best=Math.max(best,cur) }
      else if(t!==today) miss++;
    }
    if(miss>=2) cur=0;
  }
  d.streak=cur; d.best=best; d.warn = cur>0 && miss===1;
  const lv = cur>=30?5:cur>=14?4:cur>=7?3:cur>=3?2:cur>=1?1:0;
  d.fire = Math.max(0, lv-(d.warn?1:0));
  // 每个学习日一个宝箱：掉落由日期决定，换电脑也一样；已有的不会重复掉
  const pools=[0,1,2].map(r=>LOOT.filter(o=>o.r===r));
  for(const day of days){
    const v=strHash(day+"#r"), r = v<.1?2:v<.4?1:0;
    let pool=pools[r].filter(o=>!d.owned.has(o.id));
    if(!pool.length) pool=pools.flat().filter(o=>!d.owned.has(o.id));
    if(!pool.length){ d.loot[day]=null; continue }
    const item = pool[Math.floor(strHash(day+"#i")*pool.length)];
    d.loot[day]=item.id; d.owned.set(item.id, day);
  }
  for(const o of LOOT) if(o.ms && best>=o.ms) d.owned.set(o.id, `连续 ${o.ms} 天`);
  d.unopened = days.filter(x=>d.loot[x] && !opened.has(x));
  const last = days[days.length-1];
  d.since = last ? Math.round((new Date(today+"T12:00:00")-new Date(last+"T12:00:00"))/864e5) : 99;
  d.studiedToday = d.since===0;
  d.hungry = d.ready && d.since>=2;
  let step = (data.today||"").split("。")[0].replace(/（[^）]*）/g,"").replace(/^先做/,"").trim();
  if(step.length>22) step = step.slice(0,21)+"…";
  d.step = step || "打开学习卡，看看今天学什么";
  DAILY = d;
  for(const k of ["hat","color","pet"]) if(LOOK[k] && !d.owned.has(LOOK[k])) LOOK[k]=null;
}
function bodyCols(t){
  const o = LOOK.color && byId[LOOK.color];

  return [o.c[0],o.c[1],mix(o.c[0],"#ffffff",.3)];
}

}
// 宝箱：今天以前学过、还没打开的每一天各一个
let chestBox = null;
function drawChest(x,y){
  if(STYLE==="smooth") return drawChestSmooth(x,y);
  chestBox = null;
  const n = DAILY.unopened.length; if(!n) return;
  const b = Math.abs(Math.sin(frame/8))*4;
  const cy = y-b;
  mx.fillStyle="rgba(0,0,0,.3)"; mx.beginPath(); mx.ellipse(x+9,y+12,12,3,0,0,7); mx.fill();
  mx.fillStyle="#7a4b2a"; mx.fillRect(x,cy,18,12); mx.fillStyle="#9a6236"; mx.fillRect(x,cy-6,18,7);
  mx.fillStyle="#f2c14e"; mx.fillRect(x,cy,18,2); mx.fillRect(x+7,cy-2,4,6); mx.fillRect(x,cy-6,2,18); mx.fillRect(x+16,cy-6,2,18);
  mx.font=FN(10); mx.textAlign="center"; mx.fillStyle="#f2c14e";
  mx.fillText(n>1?`!×${n}`:"!", x+9, cy-12);
  chestBox = [x-8,cy-24,x+26,y+14];
}
// 对话气泡：今日第一步 / 肚子饿 / 学过了
function drawBubble(x,y){
  if(!data) return;
  let msg;
  if(!DAILY.ready) msg = "更新 Apps Script 后，我就能看到你每天的学习记录";
  else if(DAILY.studiedToday) msg = `今天学过啦！营火连续 ${DAILY.streak} 天`;
  else if(DAILY.hungry) msg = `好饿…先做：${DAILY.step}`;
  else if(DAILY.warn) msg = `营火快灭了！先做：${DAILY.step}`;
  else msg = `今天第一步：${DAILY.step}`;
  if(STYLE==="smooth") return drawBubbleSmooth(x,y,msg,DAILY.hungry||DAILY.warn);
  mx.font=F(13);
  const w = Math.min(260, mx.measureText(msg).width+16), lines=[];
  let line="";
  for(const ch of msg){ if(mx.measureText(line+ch).width>w-16){ lines.push(line); line="" } line+=ch }
  lines.push(line);
  const h = lines.length*16+10, bx = Math.max(4,Math.min(W-w-4,x-w/2)), by = y-58-h+Math.sin(frame/14)*1.5;
  mx.fillStyle="#000"; mx.fillRect(bx+3,by+3,w,h);
  mx.fillStyle = DAILY.hungry||DAILY.warn ? "#ffe2e2" : "#fffbe8"; mx.fillRect(bx,by,w,h);
  mx.fillStyle="#141826"; mx.fillRect(bx,by,w,2); mx.fillRect(bx,by+h-2,w,2); mx.fillRect(bx,by,2,h); mx.fillRect(bx+w-2,by,2,h);
  const tx = Math.max(bx+8,Math.min(bx+w-14,x-3));
  mx.fillStyle = DAILY.hungry||DAILY.warn ? "#ffe2e2" : "#fffbe8"; mx.fillRect(tx,by+h-2,6,6);
  mx.fillStyle="#141826"; mx.fillRect(tx-2,by+h,2,4); mx.fillRect(tx+6,by+h,2,4); mx.fillRect(tx,by+h+4,6,2);
  mx.textAlign="left";
  lines.forEach((l,k)=>mx.fillText(l,bx+8,by+17+k*16));
}

// ---------- 开宝箱 ----------
function itemPreview(ctx,o,w,h,t=0){
  ctx.clearRect(0,0,w,h); ctx.imageSmoothingEnabled=false;
  const s = Math.max(2,Math.floor(Math.min(w/15,h/13)));
  if(o.kind==="camp" || o.kind==="pet"){ const cols=Math.max(...o.px.map(r=>r.length)); const ss=Math.floor(Math.min(w/(cols+2),h/(o.px.length+2))); drawGrid(ctx,(w-cols*ss)/2,(h-o.px.length*ss)/2,ss,o.px); return }
  const save = {...LOOK}; LOOK[o.kind]=o.id;
  drawClawd(ctx,(w-11*s)/2,(h-8*s)/2+s,s,0,t);
  Object.assign(LOOK,save);
}
function openChest(){
  const day = DAILY.unopened[0]; if(!day) return;
  const o = byId[DAILY.loot[day]];
  const box = document.getElementById("loot");
  const cv = document.getElementById("lootCv"), c = cv.getContext("2d");
  cv.width = Math.round(240*DPR()); cv.height = Math.round(170*DPR()); c.setTransform(DPR(),0,0,DPR(),0,0);
  document.getElementById("lootDay").textContent = `${day} 的学习奖励`;
  document.getElementById("lootName").textContent = "";
  document.getElementById("lootMeta").textContent = "";
  const eq = document.getElementById("lootEquip"); eq.hidden = true;
  box.hidden = false;
  const t0 = performance.now(), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  (function anim(now){
    const t = reduce ? 2 : (now-t0)/1000;
    c.clearRect(0,0,240,170); c.imageSmoothingEnabled=false;
    const cx=120, cy=85;
    if(t<1.1){ // 宝箱越抖越厉害
      const sh = Math.sin(t*40)*t*5;
      c.fillStyle="#7a4b2a"; c.fillRect(cx-36+sh,cy-6,72,40); c.fillStyle="#9a6236"; c.fillRect(cx-36+sh,cy-30,72,26);
      c.fillStyle="#f2c14e"; c.fillRect(cx-36+sh,cy-6,72,5); c.fillRect(cx-7+sh,cy-12,14,18);
    } else {
      const k = Math.min(1,(t-1.1)*3);
      const col = RARITY[o.r].c;
      c.save(); c.translate(cx,cy); c.rotate(t*.7);
      for(let i=0;i<12;i++){ c.rotate(Math.PI/6); c.fillStyle=`${col}${o.r>=2?"55":"33"}`; c.beginPath(); c.moveTo(0,0); c.lineTo(-10,-200); c.lineTo(10,-200); c.fill() }
      c.restore();
      if(t<1.4){ c.fillStyle=`rgba(255,255,255,${1-(t-1.1)/.3})`; c.fillRect(0,0,240,170) }
      const off = document.createElement("canvas"); off.width=240; off.height=192;
      itemPreview(off.getContext("2d"),o,240,192,now/16);
      const sz = 120*(0.6+0.4*k);
      c.drawImage(off,cx-sz/2,cy-sz*0.4,sz,sz*0.8);
      if(!document.getElementById("lootName").textContent){
        document.getElementById("lootName").textContent = o.name;
        document.getElementById("lootName").style.color = RARITY[o.r].c;
        document.getElementById("lootMeta").textContent = `${RARITY[o.r].n} · ${KIND[o.kind]}${DAILY.unopened.length>1?` · 还有 ${DAILY.unopened.length-1} 个宝箱`:""}`;
        if(o.kind!=="camp"){ eq.hidden=false; eq.onclick=()=>{ equip(o.id); eq.textContent="已装备" } ; eq.textContent="马上装备" }
        opened.add(day); try{ localStorage.setItem("clawd-opened",JSON.stringify([...opened])) }catch(e){}
      }
    }
    if(!box.hidden && t<8) requestAnimationFrame(anim);
  })(t0);
}
function equip(id){
  const o = byId[id]; if(!o || o.kind==="camp") return;
  LOOK[o.kind] = LOOK[o.kind]===id ? null : id;
  try{ localStorage.setItem("clawd-look",JSON.stringify(LOOK)) }catch(e){}
  drawFace(); renderBag();
}
function renderBag(){
  const grid = document.getElementById("bagGrid"); if(!grid) return;
  grid.innerHTML = "";
  const owned = DAILY.owned;
  document.getElementById("bagCount").textContent = `${owned.size} / ${LOOT.length}`;
  for(const o of LOOT){
    const has = owned.has(o.id), on = LOOK[o.kind]===o.id;
    const b = document.createElement("button"); b.type="button"; b.className="slot"+(has?"":" lock")+(on?" on":"");
    b.style.borderColor = has ? RARITY[o.r].c : "";
    b.title = has ? `${o.name}（${RARITY[o.r].n}${KIND[o.kind]}）· 来自 ${owned.get(o.id)}` : (o.ms ? `连续学习 ${o.ms} 天解锁` : "开宝箱获得");
    const cv = document.createElement("canvas"); cv.width=96; cv.height=80;
    if(has) itemPreview(cv.getContext("2d"),o,96,80);
    const cap = document.createElement("span"); cap.textContent = has ? o.name : (o.ms ? `🔥${o.ms}天` : "？");
    b.append(cv,cap);
    if(has && o.kind!=="camp") b.onclick=()=>equip(o.id);
    grid.append(b);
  }
}
function updateDaily(){
  computeDaily();
  const st = document.getElementById("streak"), md = document.getElementById("mood"), cb = document.getElementById("chestBtn");
  if(!DAILY.ready){ st.textContent="🔥 —"; md.textContent="需要更新 Apps Script"; cb.hidden=true; return }
  st.textContent = `🔥 连续 ${DAILY.streak} 天`;
  md.textContent = DAILY.studiedToday ? "精神满满" : DAILY.hungry ? `饿了 ${DAILY.since} 天` : DAILY.warn ? "营火快灭了" : "等你开工";
  md.className = "chip " + (DAILY.studiedToday ? "g" : (DAILY.hungry||DAILY.warn) ? "r" : "");
  cb.hidden = !DAILY.unopened.length;
  document.getElementById("chestN").textContent = DAILY.unopened.length;
  renderBag();
}

function drawFace(){ const fe=document.getElementById("face"), k=Math.max(1,Math.round(36*DPR()))/48; fe.width=fe.height=Math.round(48*k); const fc=fe.getContext("2d"); fc.setTransform(k,0,0,k,0,0); fc.imageSmoothingEnabled=false; fc.clearRect(0,0,48,48); drawClawd(fc, tier>=2?2:5, tier>=3?16:12, 3, tier, frame) }

// ---------- 画风：pixel（像素）/ smooth（圆润卡通）----------
// smooth 画风用矢量图形：渐变、圆角、曲线；关卡、数据、机制和像素版完全一样
var STYLE = "pixel";
try{
  const q = new URLSearchParams(location.search).get("style");
  STYLE = q==="smooth"||q==="pixel" ? q : (localStorage.getItem("clawd-style") || "pixel");
}catch(e){}
document.body.classList.toggle("smooth", STYLE==="smooth");
const F  = n => `${n}px ${STYLE==="smooth" ? '"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif' : "DotGothic16, sans-serif"}`;
const FB = n => `${STYLE==="smooth" ? "700 " : ""}${n}px ${STYLE==="smooth" ? '"ZCOOL KuaiLe","Noto Sans SC",sans-serif' : "DotGothic16, sans-serif"}`;
const FN = n => STYLE==="smooth" ? `800 ${Math.round(n*1.45)}px "Noto Sans SC",sans-serif` : `${n}px 'Press Start 2P', monospace`;

function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r) }
function lg(ctx,x0,y0,x1,y1,stops){ const g=ctx.createLinearGradient(x0,y0,x1,y1); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g }

// 像素网格的柔和版：每个格子画成小圆角方块，帽子、宠物、营地装饰两种画风都能用
function drawGridSoft(ctx,x,y,s,rows,i0,j0){
  rows.forEach((row,j)=>[...row].forEach((c,i)=>{
    if(c===".") return;
    ctx.fillStyle = PAL[c]||c; rr(ctx,x+(i0+i)*s-.3,y+(j0+j)*s-.3,s+.6,s+.6,s*.35); ctx.fill();
  }));
}

// 小 Clawd（圆润版）：和像素版占同样的 11×8 格子，装备也在同样位置
function drawClawdSmooth(ctx,x,y,s,tier,t=0,legPhase=0){
  const bc = bodyCols(t), tired = DAILY.hungry, cx = x+5.5*s;
  ctx.fillStyle="rgba(0,0,0,.28)"; ctx.beginPath(); ctx.ellipse(cx,y+8.3*s,5*s,1.1*s,0,0,7); ctx.fill();
  if(tier>=4){
    const g=ctx.createRadialGradient(cx,y+3*s,s,cx,y+3*s,9*s);
    g.addColorStop(0,`rgba(255,214,102,${.4+.15*Math.sin(t/6)})`); g.addColorStop(1,"rgba(255,214,102,0)");
    ctx.fillStyle=g; ctx.fillRect(x-4*s,y-6*s,19*s,17*s);
  }
  if(tier>=3){ ctx.fillStyle=lg(ctx,0,y+s,0,y+8*s,[[0,"#4c6ef5"],[1,"#2f45b8"]]); rr(ctx,x+1.2*s,y+1.2*s,8.6*s,6.6*s,[1.5*s,1.5*s,2.5*s,2.5*s]); ctx.fill() }
  // 腿
  const legs=[2,4,6,8];
  legs.forEach((i,k)=>{
    const up = legPhase && ((k%2===0 && legPhase>0) || (k%2===1 && legPhase<0)) ? .9*s : 0;
    ctx.fillStyle=bc[1]; rr(ctx,x+(i+.05)*s,y+5.6*s,.95*s,2.3*s-up,.45*s); ctx.fill();
  });
  // 手臂
  ctx.fillStyle=bc[1]; rr(ctx,x+.15*s,y+2.1*s,2.4*s,1.9*s,.9*s); ctx.fill(); rr(ctx,x+8.45*s,y+2.1*s,2.4*s,1.9*s,.9*s); ctx.fill();
  // 身体
  ctx.fillStyle=lg(ctx,0,y,0,y+6*s,[[0,bc[2]],[.45,bc[0]],[1,bc[1]]]);
  rr(ctx,x+2*s,y,7*s,6*s,1.7*s); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.28)"; rr(ctx,x+2.8*s,y+.45*s,3.2*s,1*s,.5*s); ctx.fill();
  // 眼睛
  [3.5,7.5].forEach(ex=>{
    if(tired){ ctx.strokeStyle="#1b1b2e"; ctx.lineWidth=.35*s; ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(x+(ex-.45)*s,y+3.3*s); ctx.lineTo(x+(ex+.45)*s,y+3.3*s); ctx.stroke(); return }
    ctx.fillStyle="#1b1b2e"; ctx.beginPath(); ctx.ellipse(x+ex*s,y+3*s,.5*s,.95*s,0,0,7); ctx.fill();
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(x+(ex+.15)*s,y+2.6*s,.2*s,0,7); ctx.fill();
  });
  ctx.fillStyle="rgba(255,120,140,.32)"; ctx.beginPath(); ctx.ellipse(x+2.9*s,y+4.3*s,.6*s,.35*s,0,0,7); ctx.ellipse(x+8.1*s,y+4.3*s,.6*s,.35*s,0,0,7); ctx.fill();
  // 装备
  if(!LOOK.hat && tier>=1 && tier<3){
    ctx.fillStyle="#e5484d"; rr(ctx,x+1.9*s,y+.9*s,7.2*s,.75*s,.35*s); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+9*s,y+1.1*s); ctx.quadraticCurveTo(x+10.4*s,y+1.2*s,x+10.6*s,y+2.4*s); ctx.lineTo(x+10*s,y+2.2*s); ctx.quadraticCurveTo(x+9.8*s,y+1.6*s,x+9*s,y+1.7*s); ctx.fill();
  }
  if(!LOOK.hat && tier===3){
    ctx.fillStyle=lg(ctx,0,y-2.2*s,0,y+.6*s,[[0,"#eef1f8"],[1,"#9aa4bd"]]);
    ctx.beginPath(); ctx.moveTo(x+2*s,y+.7*s); ctx.quadraticCurveTo(x+5.5*s,y-3*s,x+9*s,y+.7*s); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#e5484d"; ctx.beginPath(); ctx.ellipse(x+5.5*s,y-1.9*s,.5*s,1*s,0,0,7); ctx.fill();
  }
  if(!LOOK.hat && tier>=4){
    ctx.fillStyle=lg(ctx,0,y-2.4*s,0,y+.4*s,[[0,"#ffe58a"],[1,"#e0a526"]]);
    ctx.beginPath(); ctx.moveTo(x+2.3*s,y+.4*s); [2.3,3.7,4.6,5.5,6.4,7.3,8.7].forEach((px_,k)=>ctx.lineTo(x+px_*s,y+(k%2?-.6:-2.2)*s)); ctx.lineTo(x+8.7*s,y+.4*s); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#e5484d"; ctx.beginPath(); ctx.arc(x+5.5*s,y-.4*s,.4*s,0,7); ctx.fill();
  }
  if(tier>=2){
    ctx.fillStyle=lg(ctx,x+10.6*s,0,x+11.6*s,0,[[0,tier>=4?"#fff2c2":"#ffffff"],[1,tier>=4?"#f2c14e":"#a9b4cc"]]);
    ctx.beginPath(); ctx.moveTo(x+11.1*s,y-3.4*s); ctx.lineTo(x+11.7*s,y-2.4*s); ctx.lineTo(x+11.7*s,y+3.8*s); ctx.lineTo(x+10.5*s,y+3.8*s); ctx.lineTo(x+10.5*s,y-2.4*s); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#f2c14e"; rr(ctx,x+9.8*s,y+3.8*s,2.6*s,.6*s,.3*s); ctx.fill();
    ctx.fillStyle="#7a4b2a"; rr(ctx,x+10.75*s,y+4.4*s,.7*s,1.4*s,.3*s); ctx.fill();
  }
  if(LOOK.hat && byId[LOOK.hat]){ const h=byId[LOOK.hat]; drawGridSoft(ctx,x,y,s,h.px,0,h.j0) }
  if(LOOK.pet && byId[LOOK.pet]){ const p=byId[LOOK.pet]; drawGridSoft(ctx,x,y,s,p.px,14,3+Math.sin(t/7)*.6) }
}

// 地形（圆润版）：按屏幕真实像素预先画好；区域颜色用线性渐变自然过渡
function buildTerrainSmooth(H){
  landGrid = [];
  const Z = ZOOM, c = document.createElement("canvas"); c.width=W*Z; c.height=H*Z;
  const g = c.getContext("2d"); g.setTransform(Z,0,0,Z,0,0);
  const sea = lg(g,0,0,W,0,[[0,"#2b7bb9"],[.5,"#3a96d1"],[1,"#2b7bb9"]]);
  g.fillStyle=sea; g.fillRect(0,0,W,H);
  // 海岸线：两侧各一条起伏的曲线
  const shore = (y,side)=> (side? W-1 : 0) + (side?-1:1)*(34 + noise(y/140+side*9,side*3)*46 + Math.sin(y/90+side)*8);
  const land = new Path2D();
  land.moveTo(shore(0,0),0);
  for(let y=0;y<=H;y+=12) land.lineTo(shore(y,0),y);
  for(let y=H;y>=0;y-=12) land.lineTo(shore(y,1),y);
  land.closePath();
  // 浅滩
  g.save(); g.translate(0,0); g.strokeStyle="rgba(170,225,245,.55)"; g.lineWidth=22; g.stroke(land); g.strokeStyle="rgba(255,255,255,.35)"; g.lineWidth=6; g.setLineDash([18,22]); g.stroke(land); g.restore(); g.setLineDash([]);
  // 地面：每个区域一种颜色，交界处 2 关距离内渐变
  const ground = g.createLinearGradient(0,H,0,0);
  const y2o = y => Math.min(1,Math.max(0,(H-y)/H));
  ground.addColorStop(0, ZONES[zoneStarts[0].zone].g[1]);
  zoneStarts.forEach((b,k)=>{
    if(k===0) return;
    const yb = (nodes[b.i][1]+nodes[b.i-1][1])/2, prev = ZONES[zoneStarts[k-1].zone].g[1], cur = ZONES[b.zone].g[1];
    ground.addColorStop(y2o(yb+STEP*.9), prev); ground.addColorStop(y2o(yb-STEP*.9), cur);
  });
  ground.addColorStop(1, ZONES[zoneStarts[zoneStarts.length-1].zone].g[1]);
  g.fillStyle=ground; g.fill(land);
  g.save(); g.clip(land);
  // 地面上的明暗斑块，让草地不显得平
  for(let k=0;k<H/14;k++){
    const x=hash(k,21)*W, y=hash(k,22)*H, r=30+hash(k,23)*70;
    g.fillStyle = hash(k,24)>.5 ? "rgba(255,255,255,.07)" : "rgba(0,0,0,.06)";
    g.beginPath(); g.ellipse(x,y,r,r*.6,0,0,7); g.fill();
  }
  // 沙滩边
  g.strokeStyle="rgba(240,220,160,.9)"; g.lineWidth=10; g.stroke(land);
  g.restore();
  // 小路附近不放树和山
  const near = (x,y,d)=>curves.some(p=>{ for(let k=0;k<p.length;k+=3){ const [a,b]=p[k]; if(Math.abs(a-x)<d&&Math.abs(b-y)<d) return true } return false })
    || nodes.some(([a,b])=>Math.abs(a-x)<d+18&&Math.abs(b-y)<d+18);
  const inLand = (x,y)=> x>shore(y,0)+16 && x<shore(y,1)-16;
  // 山
  for(let k=0;k<H/120;k++){
    const x=hash(k,31)*W, y=hash(k,32)*H; if(!inLand(x,y) || near(x,y,46)) continue;
    const z=zoneAt(y,x), h=26+hash(k,33)*22, w=h*1.25;
    g.fillStyle="rgba(0,0,0,.16)"; g.beginPath(); g.ellipse(x+6,y+4,w*.75,7,0,0,7); g.fill();
    g.fillStyle=lg(g,x-w/2,0,x+w/2,0,[[0,mix(z.g[0],"#8a93a8",.6)],[.55,mix(z.g[0],"#6c7590",.7)],[1,"#4c5470"]]);
    g.beginPath(); g.moveTo(x-w/2,y+2); g.quadraticCurveTo(x-w*.12,y-h*1.05,x,y-h); g.quadraticCurveTo(x+w*.12,y-h*1.05,x+w/2,y+2); g.closePath(); g.fill();
    g.fillStyle="rgba(255,255,255,.9)"; g.beginPath(); g.moveTo(x-w*.17,y-h*.62); g.quadraticCurveTo(x,y-h*1.08,x+w*.17,y-h*.62); g.quadraticCurveTo(x,y-h*.5,x-w*.17,y-h*.62); g.fill();
  }
  // 树：圆圆的树冠 + 高光
  for(let k=0;k<H/9;k++){
    const x=hash(k,41)*W, y=hash(k,42)*H; if(!inLand(x,y) || near(x,y,24)) continue;
    const z=zoneAt(y,x), r=7+hash(k,43)*6;
    g.fillStyle="rgba(0,0,0,.18)"; g.beginPath(); g.ellipse(x+3,y+r*.9,r*.9,r*.35,0,0,7); g.fill();
    g.fillStyle="#7a5232"; rr(g,x-1.5,y,3,r*.9,1.5); g.fill();
    g.fillStyle=lg(g,0,y-r*1.8,0,y+r*.3,[[0,z.tree[1]],[1,z.tree[0]]]);
    g.beginPath(); g.arc(x,y-r*.6,r,0,7); g.arc(x-r*.6,y-r*.1,r*.7,0,7); g.arc(x+r*.6,y-r*.1,r*.7,0,7); g.fill();

function layout(n){
  // Saga 地图：第 1 关在最下面，一条路左右摆动着往上走
  const H = 160 + (n-1)*STEP + 200;
  nodes = [];
  for(let i=0;i<n;i++){
    const x = W/2 + Math.sin(i*.85)*120 + (hash(i,7)-.5)*50;
    nodes.push([x, H-150-i*STEP+(hash(i,3)-.5)*24]);
  }
  // Catmull-Rom 曲线，并加一点横向弯折
  curves = [];
  for(let i=0;i<n-1;i++){
    const p0=nodes[Math.max(0,i-1)], p1=nodes[i], p2=nodes[i+1], p3=nodes[Math.min(n-1,i+2)];
    const pts=[], wig=(hash(i,11)-.5)*30;
    for(let k=0;k<=30;k++){
      const t=k/30, t2=t*t, t3=t2*t;
      let x=.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3);
      let y=.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);

}

    g.fillStyle="#7d8597"; g.beginPath(); g.moveTo(x-14,y+10); g.lineTo(x,y-14); g.lineTo(x+14,y+10); g.fill();
    g.fillStyle="#5c6475"; g.beginPath(); g.moveTo(x,y-14); g.lineTo(x+14,y+10); g.lineTo(x+2,y+10); g.fill();
    g.fillStyle="#eef0f7"; g.beginPath(); g.moveTo(x-4,y-7); g.lineTo(x,y-14); g.lineTo(x+4,y-7); g.fill();
  }
  // 树：带影子的小松树
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
    if(!land[j][i] || elev[j][i]<.3 || elev[j][i]>.78 || hash(i*7,j*13)<.9) continue;
    const x=i*T+4, y=j*T+4;
    if(curves.some(p=>p.some(([px_,py])=>Math.abs(px_-x)<18&&Math.abs(py-y)<18))) continue;
    if(nodes.some(([nx,ny])=>Math.abs(nx-x)<30&&Math.abs(ny-y)<30)) continue;
    g.fillStyle="rgba(0,0,0,.3)"; g.beginPath(); g.ellipse(x+4,y+9,7,3,0,0,7); g.fill();
    g.fillStyle="#6b4226"; g.fillRect(x-1,y+3,3,6);
    const tz=zoneAt(y, x).tree;
    g.fillStyle=tz[0]; g.beginPath(); g.moveTo(x-7,y+5); g.lineTo(x+1,y-11); g.lineTo(x+8,y+5); g.fill();
    g.fillStyle=tz[1]; g.beginPath(); g.moveTo(x-5,y); g.lineTo(x+1,y-11); g.lineTo(x+1,y); g.fill();
  }
  // 小路：先画影子再画路面，路面有砖纹
  const road=(off,w,col)=>{ g.fillStyle=col; for(const pts of curves) for(const [x,y] of pts) g.fillRect(Math.round(x-w/2),Math.round(y-w/2+off),w,w) };
  road(4,12,"rgba(0,0,0,.25)"); road(0,12,"#b89a62"); road(0,8,"#e2cc95");
  for(const pts of curves) pts.forEach(([x,y],k)=>{ if(k%4===0){ g.fillStyle="#c4a873"; g.fillRect(Math.round(x)-1,Math.round(y)-1,3,3) } });
  // 区域入口的牌子
  for(const b of zoneStarts){
    const z=ZONES[b.zone], y=nodes[b.i][1]+58;
    g.font=F(14); g.textAlign="center";
    const w=g.measureText(z.name).width+24;
    g.fillStyle="#3c2414"; g.fillRect(W/2-w/2+3,y+3,w,24);
    g.fillStyle="#7a4b2a"; g.fillRect(W/2-w/2,y,w,24);
    g.fillStyle="#f2c14e"; g.fillText(z.name,W/2,y+17);
  }
  return c;
}

function drawNode(i,x,y,s,isToday){
  if(STYLE==="smooth") return drawNodeSmooth(i,x,y,s,isToday);
  const col = !s ? "#6b7393" : {cleared:"#46c37b", shaky:"#f2c14e", unrec:"#7fb0e0", todo:"#8a92b0"}[s.status];
  // 圆柱形石台：侧面 + 顶面
  mx.fillStyle="rgba(0,0,0,.35)"; mx.beginPath(); mx.ellipse(x+3,y+12,22,8,0,0,7); mx.fill();
  mx.fillStyle="#5a4632"; mx.fillRect(x-20,y,40,9);
  mx.beginPath(); mx.ellipse(x,y+9,20,7,0,0,Math.PI); mx.fill();
  mx.fillStyle = s&&s.status==="cleared" ? "#8fd8a4" : "#a4917a";
  mx.beginPath(); mx.ellipse(x,y,20,7,0,0,7); mx.fill();
  mx.fillStyle = "rgba(255,255,255,.25)"; mx.beginPath(); mx.ellipse(x-4,y-2,10,3,0,0,7); mx.fill();
  if(isToday){
    const a=.5+.5*Math.sin(frame/8);
    mx.strokeStyle=`rgba(242,193,78,${a})`; mx.lineWidth=3; mx.beginPath(); mx.ellipse(x,y,25,10,0,0,7); mx.stroke();
  }
  // 旗
  mx.fillStyle="#eef0f7"; mx.fillRect(x+10,y-34,3,34);
  const wave=Math.sin(frame/10+i)*2;
  mx.fillStyle=col; mx.beginPath(); mx.moveTo(x+13,y-34); mx.lineTo(x+30,y-30+wave); mx.lineTo(x+13,y-24); mx.fill();
  mx.font=FN(9); mx.textAlign="center"; mx.fillStyle="#2b2018"; mx.fillText(String(i+1),x,y+4);
  if(s){
    let label=s.name, fs_=13;
    mx.font=F(fs_);
    while(mx.measureText(label).width>150 && fs_>10){ fs_--; mx.font=F(fs_) }
    while(mx.measureText(label).width>150 && label.length>2) label=label.slice(0,-2)+"…";
    const w=mx.measureText(label).width+10;
    mx.fillStyle="rgba(20,24,38,.78)"; mx.fillRect(x-w/2,y+16,w,18);
    mx.fillStyle="#eef0f7"; mx.fillText(label,x,y+29);
  }
}

function drawMap(){
  const n = data ? data.stages.length : 12;
  if(!terrain || nodes.length!==n){
    W = fitWidth();
    const H = layout(n); MH = H;
    if(H*ZOOM > 32000) ZOOM = Math.max(1, Math.floor(32000/H)); // 浏览器画布高度上限
    map.width = W*ZOOM; map.height = H*ZOOM; map.style.width = (W*ZOOM/DPR())+"px";
    computeZoneStarts(); terrain = buildTerrain(H);
  }
  mx.setTransform(ZOOM,0,0,ZOOM,0,0); mx.imageSmoothingEnabled = false;
  const sc = MH/(map.clientHeight||MH);
  const vy0 = Math.max(0, Math.floor((stageEl.scrollTop-map.offsetTop)*sc) - 80);
  const vh = Math.min(MH-vy0, Math.ceil(stageEl.clientHeight*sc) + 160);
  mx.imageSmoothingEnabled = STYLE==="smooth";
  if(vh>0) mx.drawImage(terrain,0,vy0*terrainScale,W*terrainScale,vh*terrainScale,0,vy0,W,vh);
  // 海浪闪光
  if(STYLE!=="smooth") for(let k=0;k<40;k++){
    const x=(hash(k,1)*W+frame*.4)%W, y=vy0+hash(k,2)*vh;
    const row=landGrid[Math.floor(y/T)];
    if(row && row[Math.floor(x/T)]===false){ mx.fillStyle="rgba(255,255,255,.35)"; mx.fillRect(x|0,y|0,6,2) }
  }
  const todayIdx = data ? data.stages.findIndex(s=>s.status==="todo") : -1;
  const [cx,cy] = clawdXY || nodes[Math.min(pos,n-1)];
  // 按 y 排序，让前面的东西挡住后面的
  const items = nodes.map((p,i)=>({y:p[1],vis:p[1]>vy0-60&&p[1]<vy0+vh+60,draw:()=>drawNode(i,p[0],p[1],data?data.stages[i]:null,i===todayIdx)}));
  const [kx,ky] = nodes[Math.min(pos,n-1)];
  if(data) items.push({y:ky-4,draw:()=>drawCamp(kx-58,ky-2)});
  items.push({y:cy+1,draw:()=>{
    const bob = walking ? Math.abs(Math.sin(frame/3))*3 : (DAILY.hungry ? 0 : Math.sin(frame/15));
    drawClawd(mx,cx-16,cy-30-bob,3,tier,frame,walking?(Math.floor(frame/4)%2?1:-1):0);
  }});
  items.filter(o=>o.vis!==false).sort((a,b)=>a.y-b.y).forEach(o=>o.draw());
  if(data && !walking){ drawChest(kx+34,ky-8); drawBubble(cx,cy) } else chestBox = null;
  // 云雾：今天的关卡往上 2 关之后都盖住
  if(data && todayIdx>=0 && todayIdx+2<n){
    const fogY = nodes[todayIdx+2][1] - 30;
    const g = mx.createLinearGradient(0,fogY,0,fogY-90);
    g.addColorStop(0,"rgba(214,222,240,0)"); g.addColorStop(1,"rgba(214,222,240,.94)");
    mx.fillStyle=g; mx.fillRect(0,fogY-90,W,90);
    mx.fillStyle="rgba(214,222,240,.94)"; mx.fillRect(0,0,W,fogY-90);
    for(let k=0;k<10;k++){
      const cx2=(hash(k,9)*W+frame*.15*(k%2?1:-1)+W)%W, cy2=fogY-60-hash(k,4)*Math.max(0,fogY-120);
      mx.fillStyle="rgba(255,255,255,.7)";
      mx.beginPath(); mx.ellipse(cx2,cy2,46,16,0,0,7); mx.ellipse(cx2+30,cy2-8,30,14,0,0,7); mx.fill();
    }
    mx.font=F(15); mx.textAlign="center"; mx.fillStyle="#39415e";
    mx.fillText(`☁ 前方还有 ${n-todayIdx-2} 关，打通眼前的关卡就会散开`, W/2, Math.max(30,fogY-110));
  }
}

function follow(y, smooth){
  const r = map.getBoundingClientRect(); if(!r.height) return;
  const target = map.offsetTop + y*(r.height/MH) - stageEl.clientHeight/2;
  stageEl.style.scrollBehavior = smooth ? "smooth" : "auto";
  stageEl.scrollTop = Math.max(0,target);
}
(function loop(){ frame++; drawMap(); requestAnimationFrame(loop) })();

function walkTo(target, done){
  if(walking) return;
  if(target===pos){ done(); return }
  walking = true;
  const dir = target>pos?1:-1, pts=[];
  for(let i=pos;i!==target;i+=dir){
    const seg = dir>0 ? curves[i] : [...curves[i-1]].reverse();
    pts.push(...seg);
  }
  const speed = Math.max(1, Math.min(4, Math.abs(target-pos))), t0 = performance.now();
  let lastFollow = 0;
  (function step(now=performance.now()){
    const k = (now-t0)/1000*45*speed;
    if(k>=pts.length){ walking=false; clawdXY=null; pos=target; try{localStorage.setItem("clawd-pos",pos)}catch(e){} done(); return }
    clawdXY = pts[Math.floor(k)];
    if(now-lastFollow>120){ lastFollow=now; follow(clawdXY[1],false) }
    requestAnimationFrame(step);
  })();
}

map.addEventListener("click",e=>{
  if(!data||walking) return;
  const r = map.getBoundingClientRect(), sx = W/r.width, sy = MH/r.height;
  const x=(e.clientX-r.left)*sx, y=(e.clientY-r.top)*sy;
  if(chestBox && x>=chestBox[0] && x<=chestBox[2] && y>=chestBox[1] && y<=chestBox[3]){ openChest(); return }
  let best=-1, bd=1e9;
  nodes.forEach(([nx,ny],i)=>{ const d=(nx-x)**2+(ny-y)**2; if(d<bd){bd=d;best=i} });
  if(best<0 || bd>48*48) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){ pos=best; enterBattle(best,true) } else walkTo(best,()=>enterBattle(best,false));
});

// 战斗画面 320×180：上方三分之二是战场，下方留给对话框

function drawArena(shake=0, flash=false, clawdX=60){

  ax.fillStyle="#2c3a60"; ax.beginPath(); ax.moveTo(0,84); ax.lineTo(60,50); ax.lineTo(120,78); ax.lineTo(190,40); ax.lineTo(260,72); ax.lineTo(320,56); ax.lineTo(320,GROUND); ax.lineTo(0,GROUND); ax.fill();
  ax.fillStyle="#1f2b4d"; ax.beginPath(); ax.moveTo(0,98); ax.lineTo(80,80); ax.lineTo(150,96); ax.lineTo(230,82); ax.lineTo(320,98); ax.lineTo(320,GROUND); ax.lineTo(0,GROUND); ax.fill();
  ax.fillStyle=z.g[1]; ax.fillRect(0,GROUND,AW,180-GROUND);

  for(let k=0;k<30;k++){ ax.fillStyle=z.g[0]; ax.fillRect(hash(k,5)*AW|0,GROUND+6+hash(k,6)*60|0,3,2) }
  drawClawd(ax,clawdX,GROUND-26,3,tier,af);
  if(monHp>0){

      ax.fillRect(mx0+i*s,my0+j*s,s,s) }));
    ax.fillStyle="rgba(255,255,255,.25)"; ax.fillRect(mx0+12,my0+4,8,4);

  ax.fillStyle="#141826"; ax.fillRect(202,GROUND-50,52,7);

// ---------- 升级特效 ----------
// 闪白 → 冲击波 → 旋转光柱 → 粒子爆发 → 小 Clawd 放大弹跳；跨形态时新旧外观闪烁切换（进化）
const fx = document.getElementById("fx"), fxc = fx.getContext("2d");
let fxRun = 0;
function levelUp(from, to){
  const oldT = tierOf(from), newT = tierOf(to), evolve = newT>oldT;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dpr = Math.min(2, window.devicePixelRatio||1);
  fx.width = innerWidth*dpr; fx.height = innerHeight*dpr; fx.hidden = false;
  const Wf = fx.width, Hf = fx.height, cx = Wf/2, cy = Hf*.46, u = Math.min(Wf,Hf)/100;
  const parts = Array.from({length:140},()=>{ const a=Math.random()*7, sp=(1+Math.random()*3.5)*u*.6;
    return {x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-u*.6,s:(1+Math.random()*2)*u*.5,c:["#f2c14e","#ffe9a8","#d97757","#ffffff","#46c37b"][Math.random()*5|0]} });
  const id = ++fxRun, dur = evolve ? 4200 : 3000, t0 = performance.now();
  const close = ()=>{ if(fxRun===id){ fxRun++; fx.hidden=true } };
  fx.onclick = close;
  (function draw(now){
    if(fxRun!==id) return;
    const t = reduce ? 1.6 : (now-t0)/1000;
    fxc.clearRect(0,0,Wf,Hf);
    // 暗场
    fxc.fillStyle = `rgba(8,10,20,${Math.min(.82,t*2)})`; fxc.fillRect(0,0,Wf,Hf);
    // 旋转光柱
    const rays = evolve ? 20 : 14;
    fxc.save(); fxc.translate(cx,cy); fxc.rotate(t*.8);
    for(let k=0;k<rays;k++){
      fxc.rotate(Math.PI*2/rays);
      fxc.fillStyle = k%2 ? `rgba(242,193,78,${.22*Math.min(1,t*2)})` : `rgba(255,233,168,${.12*Math.min(1,t*2)})`;
      fxc.beginPath(); fxc.moveTo(0,0); fxc.lineTo(-u*5,-Hf); fxc.lineTo(u*5,-Hf); fxc.fill();
    }
    fxc.restore();
    // 冲击波
    for(const d of [0,.25,.5]){
      const r = Math.max(0,(t-d))*u*90, a = Math.max(0,1-(t-d)*1.2);
      if(a<=0||t<d) continue;
      fxc.strokeStyle = `rgba(255,233,168,${a})`; fxc.lineWidth = u*1.6*a+1;
      fxc.beginPath(); fxc.arc(cx,cy,r,0,7); fxc.stroke();
    }
    // 粒子
    if(!reduce) for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=u*.035; p.vx*=.99;
      fxc.fillStyle=p.c; fxc.globalAlpha=Math.max(0,1-t/2.6); fxc.fillRect(p.x,p.y,p.s,p.s) }
    fxc.globalAlpha = 1;
    // 小 Clawd：放大弹跳，进化时新旧形态闪烁
    const sc = u*1.4*(1+Math.max(0,.6-t)*1.2+Math.sin(t*9)*.04*Math.max(0,2-t));
    const showT = evolve && t<1.8 ? (Math.floor(t*(4+t*8))%2 ? newT : oldT) : newT;
    fxc.save(); fxc.imageSmoothingEnabled=false;
    if(evolve && t>1.8 && t<2.1){ fxc.fillStyle=`rgba(255,255,255,${1-(t-1.8)/.3})`; fxc.fillRect(0,0,Wf,Hf) }
    drawClawd(fxc, cx-5.5*sc, cy-4*sc, sc, showT, now/16);
    fxc.restore();
    // 文字
    const pop = Math.min(1,Math.max(0,(t-.3)*3));
    fxc.textAlign="center";
    fxc.font = FN(Math.round(u*6*(0.6+.4*pop)));
    fxc.fillStyle="#000"; fxc.fillText(evolve?"EVOLUTION!":"LEVEL UP!", cx+u*.6, cy-u*17+u*.6);
    fxc.fillStyle=`hsl(${40+Math.sin(t*6)*12},90%,62%)`; fxc.fillText(evolve?"EVOLUTION!":"LEVEL UP!", cx, cy-u*17);
    fxc.font = F(Math.round(u*4));
    fxc.fillStyle = `rgba(238,240,247,${pop})`;
    fxc.fillText(evolve ? `${FORMS[oldT].name} → ${FORMS[newT].name}` : `Lv.${from} → Lv.${to}`, cx, cy+u*16);
    fxc.font = F(Math.round(u*2.4));
    fxc.fillStyle = `rgba(154,163,194,${pop})`;
    fxc.fillText(evolve ? "小 Clawd 换上了新装备！" : `又打败了 ${to-from} 只怪`, cx, cy+u*21);
    if(t>1.2) { fxc.fillStyle=`rgba(154,163,194,${Math.min(1,t-1.2)*.8})`; fxc.fillText("点击继续", cx, Hf-u*6) }
    if(reduce || (now-t0)<dur+60000) requestAnimationFrame(draw);
  })(t0);
}
document.getElementById("formNext").addEventListener("click",()=>{
  if(!data) return;
  const c = data.stages.filter(s=>s.status==="cleared").length, t = tierOf(c);
  levelUp(Math.max(0, t>0 ? FORMS[t].min-1 : c-1), c);
});

function setStatus(msg, err){ const s=document.getElementById("status"); s.hidden=!msg; s.textContent=msg||""; s.classList.toggle("err",!!err) }

// ---------- 数据来源：你的 Google Apps Script ----------
// 网址只存在你自己的浏览器里，不写进代码，所以网站公开也不会泄露它。
// 也可以用 ?src=网址 打开一次，之后会记住。
const POLL_MS = 2*60*1000;
let srcUrl = "", lastText = "", pollTimer = 0;
try{
  const q = new URLSearchParams(location.search).get("src");
  if(q){ localStorage.setItem("clawd-src", q); history.replaceState(null,"",location.pathname) }
  srcUrl = localStorage.getItem("clawd-src") || "";
}catch(e){}

function showSetup(){
  let box = document.getElementById("setup");
  if(!box){
    box = document.createElement("form");
    box.id = "setup"; box.className = "setup";
    box.innerHTML = `<h2>连接你的学习卡</h2>
      <p>粘贴 Google Apps Script 部署后的网址（以 https://script.google.com/macros/s/ 开头）。</p>
      <input id="srcInput" type="url" required placeholder="https://script.google.com/macros/s/…/exec">
      <div style="display:flex;gap:8px"><button type="submit">开始冒险</button><button class="ghost" type="button" id="setupCancel">取消</button></div>`;
    document.getElementById("stage").appendChild(box);
    box.addEventListener("submit",e=>{
      e.preventDefault();
      srcUrl = document.getElementById("srcInput").value.trim();
      try{ localStorage.setItem("clawd-src", srcUrl) }catch(err){}
      box.hidden = true; lastText = ""; load();
    });
    document.getElementById("setupCancel").addEventListener("click",()=>{ box.hidden = true });
  }
  document.getElementById("srcInput").value = srcUrl;
  box.hidden = false;
}

async function load(){
  if(!srcUrl){ setStatus("还没连接学习卡，点 ⚙ 粘贴 Apps Script 网址。",true); showSetup(); return }
  try{
    const r = await fetch(srcUrl, {cache:"no-store"});
    if(!r.ok) throw new Error("http "+r.status);
    const p = await r.json();
    const text = p.fileContent || "";
    if(!text){ setStatus("读到了数据，但学习卡是空的。检查 Apps Script 里的 DOC_ID。",true); return }
    const time = new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
    if(text !== lastText){ lastText = text; data = parseCard(text); render() }
    setStatus(`学习卡最后更新 ${data.updated||"未知"} · ${time} 已同步，每 2 分钟自动刷新`);
  }catch(e){
    setStatus(lastText ? "这次同步失败了，显示的是上次的数据。稍后会自动重试。"
      : "读不到学习卡。检查 Apps Script 是否部署为「任何人」可访问，网址是否以 /exec 结尾。点 ⚙ 修改。", true);
  }
}
function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(()=>{ if(!document.hidden) load() }, POLL_MS);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load() });
document.getElementById("refresh").addEventListener("click",()=>load());
document.getElementById("settings").addEventListener("click",showSetup);

load(); startPolling();
document.getElementById("chestBtn").addEventListener("click",openChest);
document.getElementById("lootClose").addEventListener("click",()=>{ document.getElementById("loot").hidden=true; updateDaily() });
document.getElementById("bagBtn").addEventListener("click",()=>{ renderBag(); document.getElementById("bag").hidden=false });
document.getElementById("bagClose").addEventListener("click",()=>{ document.getElementById("bag").hidden=true });
document.getElementById("styleBtn").addEventListener("click",toggleStyle);
</script>
